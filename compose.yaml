name: agy-study-manager

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Container always listens on 5000; host port remains configurable via PORT.
      PORT: "5000"
      # Used only when DATABASE_URL is left blank.
      DB_PATH: /app/data/database.db
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - agy_study_data:/app/data
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  agy_study_data:
